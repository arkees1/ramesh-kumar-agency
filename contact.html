<main class="container">
  <section class="section">
    <h1>Contact</h1>
    <p class="lead">Fill the form and I’ll reply within the same day.</p>

    <!-- Using Formspree (replace endpoint) -->
    <form action="https://formspree.io/f/YOUR_FORMSPREE_ENDPOINT" method="POST" style="display:grid;gap:12px;max-width:700px">
      <input name="name" placeholder="Name" required style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text)"/>
      <input name="email" type="email" placeholder="Email" required style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text)"/>
      <input name="phone" placeholder="Phone (optional)" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text)"/>
      <textarea name="message" placeholder="Tell me about your project" rows="6" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text)"></textarea>
      <div style="display:flex;gap:12px">
        <button class="btn primary" type="submit">Send Message</button>
        <a class="btn ghost" href="https://wa.me/918010156827">Message on WhatsApp</a>
      </div>
    </form>
  </section>
