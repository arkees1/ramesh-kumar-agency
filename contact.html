<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact — Ramesh Kumar Automations</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root{
        --bg1:#030b33;
        --bg2:#0b0140;
        --accent:#7f5af0;
        --muted:#b9c8ff;
        --card:#15182f;
    }

    body {
        font-family: Inter, sans-serif;
        margin: 0;
        background: linear-gradient(180deg,var(--bg1),var(--bg2));
        color: white;
        padding: 20px;
        overflow-x: hidden;
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn { from { opacity:0; transform: translateY(15px);} }

    .container { max-width: 600px; margin: auto; }

    h1 {
        font-size: 32px;
        margin-bottom: 10px;
        font-weight: 600;
        animation: fadeUp 0.7s ease;
    }

    @keyframes fadeUp {
        from {opacity:0; transform: translateY(20px);}
        to {opacity:1; transform: translateY(0);}
    }

    p { font-size: 16px; color: var(--muted); margin-bottom: 30px; animation: fadeUp 1s ease; }

    input, textarea {
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #3b3b55;
        background: rgba(255,255,255,0.08);
        color: white;
        margin-bottom: 16px;
        font-size: 15px;
        transition: 0.3s;
        animation: fadeUp 1.1s ease;
    }

    input:focus, textarea:focus {
        border-color: var(--accent);
        outline: none;
        background: rgba(255,255,255,0.12);
    }

    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(90deg,var(--accent),#5a39d8);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 5px;
        transition: 0.2s;
        animation: fadeUp 1.1s ease;
    }

    button:hover { transform: translateY(-2px); }

    footer {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 14px;
        animation: fadeUp 1.3s ease;
    }

    .footer-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    a { color: var(--accent); text-decoration: none; }

    /* SUCCESS OVERLAY */
    #success-overlay {
        position: fixed;
        top:0; left:0; right:0; bottom:0;
        background: rgba(0,0,0,0.75);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeIn 0.5s ease;
    }

    #success-box {
        background: var(--card);
        padding: 28px;
        border-radius: 12px;
        text-align: center;
        width: 80%;
        max-width: 380px;
        animation: popUp 0.5s ease;
    }

    @keyframes popUp {
        from { transform: scale(0.7); opacity:0; }
        to { transform: scale(1); opacity:1; }
    }

    #success-box h2 { margin-bottom: 10px; }
    #success-box p { color: var(--muted); margin-bottom: 20px; }
    #success-box button {
        background: var(--accent);
        width: auto;
        padding: 10px 18px;
        margin-top: 5px;
    }
</style>
</head>

<body>

<div id="success-overlay">
    <div id="success-box">
        <h2>Thank You! 🎉</h2>
        <p>Your message has been received. I will reply within 24 hours.</p>
        <button onclick="closeSuccess()">Close</button>
    </div>
</div>

<div class="container">

    <h1>Contact Me</h1>
    <p>Fill the form — I reply within 24 hours.</p>

    <form id="contact-form" action="https://formspree.io/f/mzzonljp" method="POST">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <input type="text" name="company" placeholder="Company (optional)" />
        <textarea name="message" placeholder="Tell me about your project..." rows="6" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <footer>
        <div class="footer-flex">
            <div>
                <strong>Ramesh Kumar Automations</strong><br>
                <span style="color:var(--muted);">AI • Automation • Branding</span>
            </div>
            <div style="text-align:right;">
                <a href="mailto:arkees@gmail.com">arkees@gmail.com</a><br>
                <a href="https://wa.me/918010156827" style="color:#25D366;">+91 9810156827</a>
            </div>
        </div>
    </footer>

</div>

<script>
const form = document.getElementById("contact-form");
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = new FormData(form);

    const res = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { 'Accept': 'application/json' }
    });

    if (res.ok) {
        form.reset();
        document.getElementById("success-overlay").style.display = "flex";
    } else {
        alert("Something went wrong. Please try again.");
    }
});

function closeSuccess(){
    document.getElementById("success-overlay").style.display = "none";
}
</script>

</body>
</html>
